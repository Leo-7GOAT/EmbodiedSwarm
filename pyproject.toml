[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "embodied-swarm"
version = "0.2.0"
description = "Planning and control stack for mobile manipulation"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "mujoco>=3.1",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
]


[tool.setuptools.packages.find]
include = [
    "embodied_swarm*",
]