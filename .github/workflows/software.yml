name: Software and MuJoCo regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    env:
      MPLBACKEND: Agg
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - run: python -m pip install -e ".[dev,demo,profiling]"
      - run: python -m pytest -q --junitxml=artifacts/ci-python.xml
      - run: python -m demos.physical_navigation --scenario fault
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: python-${{ matrix.python }}
          path: artifacts/ci-python.xml
  cpp:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        sanitize: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -e ".[dev,profiling]"
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev libeigen3-dev ninja-build
      - run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=${{ matrix.sanitize }}
      - run: cmake --build cpp/build
      - run: ctest --test-dir cpp/build --output-on-failure
      - run: python -m pytest -q tests/test_cpp_parity.py
